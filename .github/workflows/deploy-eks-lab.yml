name: Deployment

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: 'Type "destroy" to confirm destruction of all resources (required for destroy)'
        required: false
        type: string

env:
  TF_VERSION: '1.14.3'
  TF_LOG: ''
  TF_IN_AUTOMATION: 'true'

concurrency:
  group: terraform-eks-lab
  cancel-in-progress: false

permissions: {}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.actor == github.repository_owner && github.event.inputs.action == 'apply'

    permissions:
      id-token: write
      contents: read

    outputs:
      has_changes: ${{ steps.plan.outputs.exitcode == '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ekslab-plan-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Configure Backend
        env:
          BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          BACKEND_KEY: ${{ secrets.TF_STATE_KEY }}
          BACKEND_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${BACKEND_BUCKET}"
          key          = "${BACKEND_KEY}"
          region       = "${BACKEND_REGION}"
          use_lockfile = true
          EOF

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: .terraform/providers
          key: terraform-providers-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Format Check
        run: terraform fmt -check -recursive -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allowed_cidrs: ${{ secrets.TF_VAR_ALLOWED_CIDRS }}
          TF_VAR_admin_principal_arn: ${{ secrets.TF_VAR_ADMIN_PRINCIPAL_ARN }}
          TF_VAR_budget_notification_emails: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAILS }}
        run: |
          set -u
          set +e
          terraform plan -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          echo "exitcode=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 1 ]; then
            exit 1
          fi

      - name: Encrypt Plan Artifact
        if: steps.plan.outputs.exitcode == '2'
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$TF_PLAN_PASSPHRASE" -o tfplan.enc tfplan
          rm -f tfplan

      - name: Upload Plan Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tfplan
          path: |
            tfplan.enc
            plan.txt
          retention-days: 1

      - name: Plan Failed
        if: failure()
        run: echo "## Terraform Plan Failed - check the workflow logs for details." >> $GITHUB_STEP_SUMMARY

      - name: No Changes
        if: steps.plan.outputs.exitcode == '0'
        run: echo "## Terraform Plan - no changes, apply skipped." >> $GITHUB_STEP_SUMMARY

  apply:
    name: Terraform Apply
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: aws-deploy

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ekslab-apply-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Configure Backend
        env:
          BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          BACKEND_KEY: ${{ secrets.TF_STATE_KEY }}
          BACKEND_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${BACKEND_BUCKET}"
          key          = "${BACKEND_KEY}"
          region       = "${BACKEND_REGION}"
          use_lockfile = true
          EOF

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: .terraform/providers
          key: terraform-providers-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: tfplan

      - name: Decrypt Plan Artifact
        env:
          TF_PLAN_PASSPHRASE: ${{ secrets.TF_PLAN_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --decrypt --passphrase "$TF_PLAN_PASSPHRASE" -o tfplan tfplan.enc
          rm -f tfplan.enc

      - name: Terraform Apply
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allowed_cidrs: ${{ secrets.TF_VAR_ALLOWED_CIDRS }}
          TF_VAR_admin_principal_arn: ${{ secrets.TF_VAR_ADMIN_PRINCIPAL_ARN }}
          TF_VAR_budget_notification_emails: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAILS }}
        run: |
          set -euo pipefail
          terraform apply -auto-approve tfplan 2>&1 | tee apply.txt; exit ${PIPESTATUS[0]}

      - name: Upload Apply Log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apply-log
          path: apply.txt
          retention-days: 1

      - name: Apply Succeeded
        run: echo "## EKS Lab deployed successfully. Destroy when done to avoid ongoing costs." >> $GITHUB_STEP_SUMMARY

      - name: Apply Failed
        if: failure()
        run: echo "## Terraform Apply Failed - check the workflow logs for details." >> $GITHUB_STEP_SUMMARY

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: aws-deploy
    if: |
      github.actor == github.repository_owner &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: ekslab-destroy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Configure Backend
        env:
          BACKEND_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          BACKEND_KEY: ${{ secrets.TF_STATE_KEY }}
          BACKEND_REGION: ${{ secrets.AWS_REGION }}
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${BACKEND_BUCKET}"
          key          = "${BACKEND_KEY}"
          region       = "${BACKEND_REGION}"
          use_lockfile = true
          EOF

      - name: Cache Terraform Providers
        uses: actions/cache@v5
        with:
          path: .terraform/providers
          key: terraform-providers-${{ hashFiles('.terraform.lock.hcl') }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Destroy
        env:
          TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
          TF_VAR_allowed_cidrs: ${{ secrets.TF_VAR_ALLOWED_CIDRS }}
          TF_VAR_admin_principal_arn: ${{ secrets.TF_VAR_ADMIN_PRINCIPAL_ARN }}
          TF_VAR_budget_notification_emails: ${{ secrets.TF_VAR_BUDGET_NOTIFICATION_EMAILS }}
        run: |
          set -euo pipefail
          terraform destroy -auto-approve 2>&1 | tee destroy.txt; exit ${PIPESTATUS[0]}

      - name: Upload Destroy Log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: destroy-log
          path: destroy.txt
          retention-days: 1

      - name: Destroy Succeeded
        run: echo "## EKS Lab destroyed. All ephemeral resources have been removed." >> $GITHUB_STEP_SUMMARY

      - name: Destroy Failed
        if: failure()
        run: echo "## Terraform Destroy Failed - check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
